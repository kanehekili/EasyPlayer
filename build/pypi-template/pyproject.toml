[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easympv"
version = "@xxx@"
description = "Simple video and audio player based on mpv"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.9"
dependencies = ["PyQt6"]

# numpy drives the spectrum analyzer (AudioPlay.HAS_SPECTRUM), which also needs
# parec from pulseaudio-utils - a dependency pip cannot express at all. Optional
# everywhere, matching optdepends on Arch and Suggests on the DEBs.
[project.optional-dependencies]
spectrum = ["numpy"]

[project.urls]
Homepage = "https://github.com/kanehekili/EasyPlayer"

[project.scripts]
easyplayer = "easyplayer.EasyPlayer:main"

[tool.setuptools.package-data]
easyplayer = [
    "icons/*",
    "icons/**/*",
]
