<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" version="1.1" viewBox="0 0 256 256">
  <!-- flat stop: square edges align with the outer edges of pause.svg's bars
       (x 45..212). Height 167 rather than pause's 195, since a solid square
       reads heavier than open bars at equal height.
       Red matches stop-red-icon.png in the default theme and carries on both
       light and dark grounds, so both flat themes share this fill. -->
  <rect x="45" y="44" width="167" height="167" style="paint-order:markers fill stroke;fill:#d40000"/>
</svg>
