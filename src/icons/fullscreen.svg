    <path d="M 26.20 30.73 L 19.13 23.66 L 16.09 26.70 L 14.32 14.32 L 26.70 16.09 L 23.66 19.13 L 30.73 26.20 Z"/>
    <path d="M 33.27 26.20 L 40.34 19.13 L 37.30 16.09 L 49.68 14.32 L 47.91 26.70 L 44.87 23.66 L 37.80 30.73 Z"/>
  </g>
</svg>
