<?xml version="1.0" encoding="UTF-8"?>
<!-- EasyPlayer icon. Light from above; gradients only, no filters
     or clip paths (QtSvg implements SVG Tiny 1.2).
     Four arrows radiating outwards. Their coordinates are baked at 45, 135,
     225 and 315 degrees rather than applied as transform="rotate(...)", so
     the file carries no nested transforms. -->
<!-- viewBox frames the artwork's own bounding box rather than a 64-unit square,
     so the icon fills the canvas like the neighbouring icons. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="3.30 3.70 57.50 57.50">

  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse"
                    x1="0" y1="9.00" x2="0" y2="55.00">
      <stop offset="0" stop-color="#9fd0f5"/>
      <stop offset="0.1" stop-color="#86b6de"/>
      <stop offset="0.46" stop-color="#5d8db9"/>
      <stop offset="0.5" stop-color="#5282b0"/>
      <stop offset="0.8" stop-color="#2c5b8d"/>
      <stop offset="1" stop-color="#17457a"/>
    </linearGradient>

    <linearGradient id="sheen" gradientUnits="userSpaceOnUse"
                    x1="0" y1="9.00" x2="0" y2="32.00">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path d="M 8.00 9.00 H 56.00 A 4.00 4.00 0 0 1 60.00 13.00 V 51.00 A 4.00 4.00 0 0 1 56.00 55.00 H 8.00 A 4.00 4.00 0 0 1 4.00 51.00 V 13.00 A 4.00 4.00 0 0 1 8.00 9.00 Z" fill="#000000" opacity="0.22" transform="translate(0.8,1.6)"/>
  <path d="M 8.00 9.00 H 56.00 A 4.00 4.00 0 0 1 60.00 13.00 V 51.00 A 4.00 4.00 0 0 1 56.00 55.00 H 8.00 A 4.00 4.00 0 0 1 4.00 51.00 V 13.00 A 4.00 4.00 0 0 1 8.00 9.00 Z" fill="url(#body)" stroke="#15324f" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M 8.00 9.00 H 56.00 A 4.00 4.00 0 0 1 60.00 13.00 V 51.00 A 4.00 4.00 0 0 1 56.00 55.00 H 8.00 A 4.00 4.00 0 0 1 4.00 51.00 V 13.00 A 4.00 4.00 0 0 1 8.00 9.00 Z" fill="url(#sheen)"/>
  <g fill="#ffffff" opacity="0.95">
    <path d="M 37.80 33.27 L 44.87 40.34 L 47.91 37.30 L 49.68 49.68 L 37.30 47.91 L 40.34 44.87 L 33.27 37.80 Z"/>
