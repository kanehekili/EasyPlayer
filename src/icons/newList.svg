<?xml version="1.0" encoding="UTF-8"?>
<!-- EasyPlayer icon. Light from above; gradients only, no filters
     or clip paths (QtSvg implements SVG Tiny 1.2).
     Built from playlist.svg's bars plus a green plus badge, so "new playlist"
     uses the same vocabulary as the playlist button. -->
